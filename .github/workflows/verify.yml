name: verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n setup
          sh -n docs/install
      - name: Version truth
        run: python3 tools/version_check.py
      - name: Source check
        run: bash setup --check
      - name: Rock memory check
        run: python3 characters/grak/rock_memory.py --check --no-receipt
      - name: Paper parity
        run: python3 characters/grak/credentials/exam.py --check
      - name: Smoke install + uninstall
        run: |
          bash setup --host opencode --quiet
          test -f "$HOME/.config/opencode/agent/grak.md"
          test -f "$HOME/.config/opencode/agent/grak-clone.md"
          test -f "$HOME/.config/opencode/agent/grak-builder.md"
          test -f "$HOME/.config/opencode/command/plan.md"
          test -f "$HOME/.config/opencode/command/grak.md"
          test -f "$HOME/.config/opencode/command/review.md"
          test -f "$HOME/.config/opencode/command/team.md"
          test -f "$HOME/.config/opencode/command/ship.md"
          test -f "$HOME/.config/opencode/command/land.md"
          grep -q 'mode: subagent' "$HOME/.config/opencode/agent/grak-clone.md"
          grep -q 'edit: deny' "$HOME/.config/opencode/agent/grak-clone.md"
          grep -q 'Clone duty' "$HOME/.config/opencode/agent/grak-clone.md"
          grep -q 'mode: subagent' "$HOME/.config/opencode/agent/grak-builder.md"
          grep -q 'Builder duty' "$HOME/.config/opencode/agent/grak-builder.md"
          ! grep -q 'edit: deny' "$HOME/.config/opencode/agent/grak-builder.md"
          test -f "$HOME/.grakstack/GRAK.md"
          test -f "$HOME/.grakstack/GRAK_CREDENTIALS.md"
          test -f "$HOME/.grakstack/mcq_bank.json"
          for f in grammar logic rhetoric arithmetic geometry music astronomy finance economics; do test -f "$HOME/.grakstack/curriculum/$f.md"; done
          python3 "$HOME/.grakstack/exam.py" --check
          python3 characters/grak/rock_memory.py --check
          python3 "$HOME/.grakstack/exam.py" --self-test
          test -f "$HOME/.grakstack/ROCK_RECEIPT"
          python3 characters/grak/rock_memory.py --check
          grep -q 'grakstack v' "$HOME/.config/opencode/agent/grak.md"
          grep -q 'grakstack v' "$HOME/.config/opencode/agent/grak-clone.md"
          bash setup --host opencode --uninstall --quiet
          test ! -e "$HOME/.config/opencode/agent/grak.md"
          test ! -e "$HOME/.config/opencode/agent/grak-clone.md"
          test ! -e "$HOME/.config/opencode/agent/grak-builder.md"
          test ! -e "$HOME/.config/opencode/command/plan.md"
          test ! -e "$HOME/.config/opencode/command/grak.md"
          test ! -e "$HOME/.config/opencode/command/team.md"
          test ! -e "$HOME/.grakstack/GRAK.md"
          test ! -e "$HOME/.grakstack/curriculum/finance.md"
          test ! -e "$HOME/.grakstack/ROCK_RECEIPT"
      - name: Freeze release inputs
        run: |
          V="v$(tr -d '[:space:]' < VERSION)"
          git tag -f "$V" HEAD
          MANIFEST_SHA="$(sha256sum characters/grak/ROCK_MEMORY.sha256 | awk '{print $1}')"
          COMMIT="$(git rev-parse HEAD)"
          { echo "# grakstack release checksums"; echo "$MANIFEST_SHA  ROCK_MEMORY.sha256"; echo "$COMMIT  $V"; } > "$RUNNER_TEMP/SHA256SUMS"
          echo "frozen $V at $COMMIT"
      - name: Pinned install (sh runs docs/install, verified against checksums)
        run: |
          V="v$(tr -d '[:space:]' < VERSION)"
          COMMIT="$(git rev-parse HEAD)"
          export GRAKSTACK_REPO="file://$PWD"
          export GRAKSTACK_HOME="$RUNNER_TEMP/grakstack-src"
          export GRAKSTACK_CHECKSUMS="$RUNNER_TEMP/SHA256SUMS"
          export HOME="$RUNNER_TEMP/home-sh"
          mkdir -p "$HOME"
          OUT="$(sh docs/install --host opencode --quiet)"
          printf '%s\n' "$OUT"
          printf '%s\n' "$OUT" | grep -q "grakstack: verified $V ($COMMIT)"
          test -f "$HOME/.config/opencode/agent/grak.md"
          test -f "$HOME/.config/opencode/agent/grak-clone.md"
          test -f "$HOME/.config/opencode/agent/grak-builder.md"
          test -f "$HOME/.config/opencode/command/plan.md"
          test -f "$HOME/.config/opencode/command/team.md"
          test -f "$HOME/.config/opencode/command/land.md"
          test -f "$HOME/.grakstack/exam.py"
          test -f "$HOME/.grakstack/curriculum/economics.md"
          python3 "$HOME/.grakstack/exam.py" --check
          test "$(git -C "$GRAKSTACK_HOME" rev-parse HEAD)" = "$COMMIT"
      - name: Pin negative (bad checksum aborts before setup)
        run: |
          COMMIT="$(git rev-parse HEAD)"
          sed "s/^$COMMIT /0000000000000000000000000000000000000000 /" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/BADSUMS"
          export GRAKSTACK_REPO="file://$PWD"
          export GRAKSTACK_HOME="$RUNNER_TEMP/grakstack-bad"
          export GRAKSTACK_CHECKSUMS="$RUNNER_TEMP/BADSUMS"
          export HOME="$RUNNER_TEMP/home-bad"
          mkdir -p "$HOME"
          if sh docs/install --host opencode --quiet; then
            echo "expected checksum failure"; exit 1
          fi
          test ! -e "$HOME/.config/opencode/agent/grak.md"
          test ! -e "$HOME/.grakstack/GRAK.md"
          echo "pin negative ok"
      - name: Landed receipt (tamper fails, reinstall heals)
        run: |
          export GRAKSTACK_REPO="file://$PWD"
          export GRAKSTACK_CHECKSUMS="$RUNNER_TEMP/SHA256SUMS"
          export HOME="$RUNNER_TEMP/home-tamper"
          export GRAKSTACK_HOME="$RUNNER_TEMP/grakstack-tamper"
          mkdir -p "$HOME"
          sh docs/install --host opencode --quiet
          unset GRAKSTACK_HOME
          python3 characters/grak/rock_memory.py --check | grep -q "record: current"
          printf '\nuser edit\n' >> "$HOME/.config/opencode/agent/grak.md"
          if python3 characters/grak/rock_memory.py --check; then
            echo "expected modified-file failure"; exit 1
          fi
          export GRAKSTACK_HOME="$RUNNER_TEMP/grakstack-tamper"
          sh docs/install --host opencode --quiet
          unset GRAKSTACK_HOME
          python3 characters/grak/rock_memory.py --check | grep -q "record: current"
          echo "landed receipt ok"
      - name: Ownership gate (foreign links and files kept, repo links removed)
        run: |
          export HOME="$RUNNER_TEMP/home-own"
          mkdir -p "$HOME/.claude/agents" "$HOME/.claude/commands" "$RUNNER_TEMP/elsewhere"
          printf 'user file\n' > "$RUNNER_TEMP/elsewhere/mine.md"
          ln -s "$RUNNER_TEMP/elsewhere/mine.md" "$HOME/.claude/agents/grak.md"
          printf 'user file\n' > "$HOME/.claude/commands/review.md"
          bash setup --host claude --uninstall --quiet
          test -L "$HOME/.claude/agents/grak.md"
          test -f "$HOME/.claude/commands/review.md"
          ln -s "$PWD/characters/grak/grak-agent.md" "$HOME/.claude/commands/ship.md"
          bash setup --host claude --uninstall --quiet
          test ! -e "$HOME/.claude/commands/ship.md"
          printf 'the grakstack-owned marker is described in the docs\n' > "$HOME/.claude/commands/grak.md"
          bash setup --host claude --uninstall --quiet
          test -f "$HOME/.claude/commands/grak.md"
          printf '<!-- grakstack-owned -->\n' > "$HOME/.claude/commands/grak.md"
          bash setup --host claude --uninstall --quiet
          test ! -e "$HOME/.claude/commands/grak.md"
          echo "ownership gate ok"
      - name: Installer parity (bash vs powershell)
        run: |
          for h in claude cursor codex factory opencode kiro slate openclaw hermes gbrain; do
            B="$RUNNER_TEMP/h-bash-$h"; P="$RUNNER_TEMP/h-ps-$h"
            mkdir -p "$B" "$P"
            HOME="$B" bash setup --host "$h" --quiet >/dev/null
            HOME="$P" pwsh -NoProfile -File ./setup.ps1 -TargetHost "$h" -Quiet >/dev/null
            # the receipt records absolute landed paths; normalize each HOME
            # prefix before the diff so the comparison is content, not location
            if [ -f "$B/.grakstack/ROCK_RECEIPT" ] && [ -f "$P/.grakstack/ROCK_RECEIPT" ]; then
              sed -i "s|$B|<HOME>|g" "$B/.grakstack/ROCK_RECEIPT"
              sed -i "s|$P|<HOME>|g" "$P/.grakstack/ROCK_RECEIPT"
            fi
            diff -r -x .cache -x .local "$B" "$P" || { echo "installer drift for host: $h"; exit 1; }
          done
          echo "installer parity ok"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source check (powershell)
        shell: pwsh
        run: ./setup.ps1 -Check
      - name: Smoke install (powershell)
        shell: pwsh
        run: |
          ./setup.ps1 -TargetHost opencode -Quiet
          $agent = Join-Path $HOME ".config/opencode/agent/grak.md"
          $clone = Join-Path $HOME ".config/opencode/agent/grak-clone.md"
          $builder = Join-Path $HOME ".config/opencode/agent/grak-builder.md"
          $cmd = Join-Path $HOME ".config/opencode/command/grak.md"
          $plan = Join-Path $HOME ".config/opencode/command/plan.md"
          $team = Join-Path $HOME ".config/opencode/command/team.md"
          if (-not (Test-Path $agent)) { throw "agent missing: $agent" }
          if (-not (Test-Path $clone)) { throw "clone missing: $clone" }
          if (-not (Test-Path $builder)) { throw "builder missing: $builder" }
          if (-not (Test-Path $cmd)) { throw "command missing: $cmd" }
          if (-not (Test-Path $plan)) { throw "plan command missing: $plan" }
          if (-not (Test-Path $team)) { throw "team command missing: $team" }
          if (-not ((Get-Content -LiteralPath $clone -Raw) -match "mode: subagent")) { throw "clone missing subagent mode" }
          if (-not ((Get-Content -LiteralPath $clone -Raw) -match "Clone duty")) { throw "clone missing clone duty" }
          if (-not ((Get-Content -LiteralPath $builder -Raw) -match "mode: subagent")) { throw "builder missing subagent mode" }
          if (-not ((Get-Content -LiteralPath $builder -Raw) -match "Builder duty")) { throw "builder missing builder duty" }
          $lore = Join-Path $HOME ".grakstack/GRAK.md"
          $exam = Join-Path $HOME ".grakstack/exam.py"
          $seed = Join-Path $HOME ".grakstack/curriculum/finance.md"
          if (-not (Test-Path $lore)) { throw "record missing: $lore" }
          if (-not (Test-Path $exam)) { throw "exam missing: $exam" }
          if (-not (Test-Path $seed)) { throw "curriculum seed missing: $seed" }
          python $exam --check
          python $exam --self-test
          python characters/grak/rock_memory.py --check
          $receipt = Join-Path $HOME ".grakstack/ROCK_RECEIPT"
          if (-not (Test-Path $receipt)) { throw "receipt missing: $receipt" }
          if (-not ((Get-Content -LiteralPath $agent -Raw) -match "grakstack v")) { throw "agent missing stamp" }
          if (-not ((Get-Content -LiteralPath $clone -Raw) -match "grakstack v")) { throw "clone missing stamp" }
      - name: Smoke uninstall (powershell)
        shell: pwsh
        run: |
          ./setup.ps1 -TargetHost opencode -Uninstall -Quiet
          $agent = Join-Path $HOME ".config/opencode/agent/grak.md"
          $clone = Join-Path $HOME ".config/opencode/agent/grak-clone.md"
          $builder = Join-Path $HOME ".config/opencode/agent/grak-builder.md"
          $cmd = Join-Path $HOME ".config/opencode/command/grak.md"
          $plan = Join-Path $HOME ".config/opencode/command/plan.md"
          $team = Join-Path $HOME ".config/opencode/command/team.md"
          $lore = Join-Path $HOME ".grakstack/GRAK.md"
          $seed = Join-Path $HOME ".grakstack/curriculum/finance.md"
          if (Test-Path $agent) { throw "agent not removed: $agent" }
          if (Test-Path $clone) { throw "clone not removed: $clone" }
          if (Test-Path $builder) { throw "builder not removed: $builder" }
          if (Test-Path $cmd) { throw "command not removed: $cmd" }
          if (Test-Path $plan) { throw "plan command not removed: $plan" }
          if (Test-Path $team) { throw "team command not removed: $team" }
          if (Test-Path $lore) { throw "record not removed: $lore" }
          if (Test-Path $seed) { throw "curriculum seed not removed: $seed" }
      - name: Pinned install (docs/install.ps1, verified against checksums)
        shell: pwsh
        run: |
          $version = "v" + (Get-Content VERSION -Raw).Trim()
          git tag -f $version HEAD | Out-Null
          $manifest = (Get-FileHash characters/grak/ROCK_MEMORY.sha256 -Algorithm SHA256).Hash.ToLower()
          $commit = (git rev-parse HEAD).Trim()
          $sums = Join-Path $env:RUNNER_TEMP "SHA256SUMS"
          "# grakstack release checksums`n$manifest  ROCK_MEMORY.sha256`n$commit  $version`n" | Set-Content -NoNewline $sums
          $env:GRAKSTACK_REPO = $PWD.Path
          $env:GRAKSTACK_CHECKSUMS = $sums
          $env:GRAKSTACK_HOME = Join-Path $env:RUNNER_TEMP "pin-src"
          $env:GRAKSTACK_HOST = "opencode"
          pwsh -NoProfile -File ./docs/install.ps1
          if ($LASTEXITCODE -ne 0) { throw "docs/install.ps1 failed: $LASTEXITCODE" }
          $agent = Join-Path $HOME ".config/opencode/agent/grak.md"
          if (-not (Test-Path $agent)) { throw "agent missing after pinned install" }
          $actual = (git -C $env:GRAKSTACK_HOME rev-parse HEAD).Trim()
          if ($actual -ne $commit) { throw "checkout commit drift: $actual != $commit" }
          $env:GRAKSTACK_HOME = Join-Path $HOME ".grakstack"
          python characters/grak/rock_memory.py --check
          if ($LASTEXITCODE -ne 0) { throw "record check failed after pinned install" }
          ./setup.ps1 -TargetHost opencode -Uninstall -Quiet

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: |
          V="v$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "$V" || { echo "tag $GITHUB_REF_NAME != $V"; exit 1; }
      - name: Release gates
        run: |
          bash setup --check
          python3 characters/grak/rock_memory.py --check --no-receipt
          python3 characters/grak/credentials/exam.py --check
          python3 tools/version_check.py
      - name: Release checksums
        run: |
          git fetch --depth 1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          python3 tools/make_checksums.py "$GITHUB_REF_NAME"
